<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>Inscription — Jobs Lumalia</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/auth.css">

</head>


<body>

<div id="navbar"></div>


<main class="auth-page">

<section class="auth-card">

<div class="auth-logo">
    L
</div>

<div class="eyebrow">
    COMPTE LUMALIA
</div>

<h1>
    Créer un compte
</h1>

<p class="muted">
    Votre compte vous permettra de gérer vos candidatures.
</p>


<form id="registerForm">


<label>

Pseudo Minecraft

<input
    id="registerUsername"
    type="text"
    minlength="3"
    maxlength="16"
    required
    autocomplete="username"
>

</label>


<label>

E-mail

<input
    id="registerEmail"
    type="email"
    required
    autocomplete="email"
>

</label>


<label>

Mot de passe

<input
    id="registerPassword"
    type="password"
    minlength="8"
    required
    autocomplete="new-password"
>

</label>


<label>

Confirmer le mot de passe

<input
    id="registerPassword2"
    type="password"
    minlength="8"
    required
    autocomplete="new-password"
>

</label>


<label class="check">

<input
    id="registerTerms"
    type="checkbox"
    required
>

J'accepte les conditions de recrutement.

</label>


<button
    class="btn primary full"
    type="submit"
>
    Créer mon compte
</button>


</form>


<div
    id="authMessage"
    class="form-message"
></div>


<p class="switch">

Déjà inscrit ?

<a href="connexion.html">
    Se connecter
</a>

</p>


</section>

</main>


<script src="js/navbar.js"></script>

<script
    type="module"
    src="js/auth.js"
></script>

</body>

</html>
