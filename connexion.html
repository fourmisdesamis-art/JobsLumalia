<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Connexion — Jobs Lumalia</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/auth.css">

</head>


<body>

<div id="navbar"></div>


<main class="auth-page">

<section class="auth-card">

<div class="auth-logo">L</div>

<div class="eyebrow">
    COMPTE LUMALIA
</div>

<h1>
    Connexion
</h1>

<p class="muted">
    Connectez-vous pour envoyer et suivre vos candidatures.
</p>


<form id="loginForm">

<label>
    E-mail

    <input
        id="loginEmail"
        type="email"
        required
        autocomplete="email"
    >
</label>


<label>
    Mot de passe

    <input
        id="loginPassword"
        type="password"
        required
        autocomplete="current-password"
    >
</label>


<label class="check">

<input
    id="rememberMe"
    type="checkbox"
    checked
>

Rester connecté

</label>


<button
    class="btn primary full"
    type="submit"
>
    Se connecter
</button>

</form>


<div
    id="authMessage"
    class="form-message"
></div>


<p class="switch">

Pas encore de compte ?

<a href="inscription.html">
    Créer un compte
</a>

</p>


</section>

</main>


<script src="js/navbar.js"></script>

<script
    type="module"
    src="js/auth.js"
></script>

</body>

</html>
